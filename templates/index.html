<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Validation Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="card p-4">
        <h3 class="text-center mb-4">Document Validation</h3>

        {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form action="/submit" method="post" enctype="multipart/form-data" id="uploadForm">
            <div class="mb-3">
                <label for="applicationType" class="form-label">Application Type</label>
                <select class="form-select" id="applicationType" name="application_type" required>
                    <option value="">Select Type...</option>
                    <option value="Income Certificate">Income Certificate</option>
                    <option value="OBC Certificate">OBC Certificate</option>
                    <option value="EWS Certificate">EWS Certificate</option>
                    <option value="Integrated Certificate">Integrated Certificate</option>
                    <option value="Family Member Certificate">Family Member Certificate</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="fileInput" class="form-label">Upload Document</label>
                <input type="file" class="form-control" id="fileInput" name="files" accept=".pdf,image/*" required>
                <div class="form-text">Supported formats: PDF, JPG, PNG</div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary" id="submitBtn">Submit & Process</button>
            </div>
        </form>

        <div class="loading" id="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Processing document... This may take a moment.</p>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', function () {
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
        });
    </script>
</body>

</html>
