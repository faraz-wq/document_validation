<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Validation Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            overflow: hidden;
        }
        
        .main-container {
            height: 100vh;
        }
        
        .panel {
            height: 100vh;
            overflow-y: auto;
            padding: 20px;
        }
        
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .upload-area:hover {
            border-color: #007bff;
        }
        
        .upload-area.drag-over {
            border-color: #007bff;
            background-color: #f0f8ff;
        }
        
        .document-preview {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        
        .document-preview img {
            max-width: 100%;
            max-height: 200px;
        }
        
        .summary-content {
            white-space: pre-wrap;
            font-family: monospace;
        }
        
        .application-type {
            margin-bottom: 15px;
        }
        
        .status-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container-fluid main-container">
        <div class="row g-0 h-100">
            <!-- Left Panel: Document Upload and Preview -->
            <div class="col-md-6 panel border-end">
                <h3>Document Upload</h3>
                <div class="application-type">
                    <label for="applicationType" class="form-label">Application Type:</label>
                    <select class="form-select" id="applicationType">
                        <option value="">Select Application Type</option>
                        <option value="Income Certificate">Income Certificate</option>
                        <option value="OBC Certificate">OBC Certificate</option>
                        <option value="EWS Certificate">EWS Certificate</option>
                        <option value="Integrated Certificate">Integrated Certificate</option>
                        <option value="Family Member Certificate">Family Member Certificate</option>
                    </select>
                </div>
                
                <div class="upload-area" id="uploadArea">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 48px; color: #ccc;"></i>
                    <p>Drag & drop files here or click to browse</p>
                    <p class="text-muted">Supports PDF, JPG, PNG files</p>
                    <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png" style="display: none;">
                </div>
                
                <div id="statusMessage" class="status-message"></div>
                
                <div class="loading" id="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Processing...</span>
                    </div>
                    <p>Processing documents, please wait...</p>
                </div>
                
                <div id="documentPreviews"></div>
            </div>
            
            <!-- Right Panel: Summary Display -->
            <div class="col-md-6 panel">
                <h3>Document Summary</h3>
                <div id="summaryContent" class="summary-content">
                    <div class="text-center text-muted">
                        <p>Summary will appear here after document processing</p>
                        <p>Upload documents to the left to begin</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const documentPreviews = document.getElementById('documentPreviews');
            const summaryContent = document.getElementById('summaryContent');
            const applicationType = document.getElementById('applicationType');
            const statusMessage = document.getElementById('statusMessage');
            const loading = document.getElementById('loading');
            
            // Handle click on upload area
            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });
            
            // Handle file selection
            fileInput.addEventListener('change', function(e) {
                handleFiles(e.target.files);
            });
            
            // Handle drag and drop
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('drag-over');
            });
            
            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('drag-over');
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('drag-over');
                handleFiles(e.dataTransfer.files);
            });
            
            function handleFiles(files) {
                if (files.length === 0) return;
                
                // Clear previous previews
                documentPreviews.innerHTML = '';
                
                // Preview each selected file
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const reader = new FileReader();
                    
                    reader.onload = function(e) {
                        const previewDiv = document.createElement('div');
                        previewDiv.className = 'document-preview';
                        
                        if (file.type.startsWith('image/')) {
                            // For images
                            const img = document.createElement('img');
                            img.src = e.target.result;
                            img.alt = file.name;
                            previewDiv.appendChild(img);
                        } else {
                            // For PDF and other files
                            const iconDiv = document.createElement('div');
                            iconDiv.innerHTML = `<i class="fas fa-file-pdf" style="font-size: 48px; color: #ff0000;"></i>`;
                            const nameP = document.createElement('p');
                            nameP.textContent = file.name;
                            nameP.style.marginTop = '10px';
                            previewDiv.appendChild(iconDiv);
                            previewDiv.appendChild(nameP);
                        }
                        
                        const fileName = document.createElement('p');
                        fileName.textContent = `File: ${file.name} (${formatFileSize(file.size)})`;
                        fileName.style.fontSize = '0.9em';
                        fileName.style.color = '#666';
                        previewDiv.appendChild(fileName);
                        
                        documentPreviews.appendChild(previewDiv);
                    };
                    
                    if (file.type.startsWith('image/')) {
                        reader.readAsDataURL(file);
                    } else {
                        // For non-images, just show the icon
                        const previewDiv = document.createElement('div');
                        previewDiv.className = 'document-preview';
                        const iconDiv = document.createElement('div');
                        iconDiv.innerHTML = `<i class="fas fa-file" style="font-size: 48px; color: #007bff;"></i>`;
                        const nameP = document.createElement('p');
                        nameP.textContent = file.name;
                        nameP.style.marginTop = '10px';
                        previewDiv.appendChild(iconDiv);
                        previewDiv.appendChild(nameP);
                        
                        const fileName = document.createElement('p');
                        fileName.textContent = `File: ${file.name} (${formatFileSize(file.size)})`;
                        fileName.style.fontSize = '0.9em';
                        fileName.style.color = '#666';
                        previewDiv.appendChild(fileName);
                        
                        documentPreviews.appendChild(previewDiv);
                    }
                }
            }
            
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            // Add event listener to form submission
            document.getElementById('applicationType').addEventListener('change', function() {
                if (this.value && fileInput.files.length > 0) {
                    processDocuments();
                }
            });
            
            // Function to process documents when application type is selected
            function processDocuments() {
                const appType = applicationType.value;
                const files = fileInput.files;
                
                if (!appType) {
                    showStatus('Please select an application type.', 'warning');
                    return;
                }
                
                if (files.length === 0) {
                    showStatus('Please select at least one file.', 'warning');
                    return;
                }
                
                // Show loading indicator
                loading.style.display = 'block';
                summaryContent.innerHTML = '<div class="text-center"><p>Processing documents...</p></div>';
                
                // Create form data
                const formData = new FormData();
                formData.append('application_type', appType);
                
                for (let i = 0; i < files.length; i++) {
                    formData.append('files', files[i]);
                }
                
                // Send request to API
                fetch('/extract-summary', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.detail || 'API request failed');
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    loading.style.display = 'none';
                    displaySummary(data);
                    showStatus('Documents processed successfully!', 'success');
                })
                .catch(error => {
                    loading.style.display = 'none';
                    summaryContent.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
                    showStatus('Error processing documents: ' + error.message, 'danger');
                });
            }
            
            function displaySummary(data) {
                // Clear previous content
                summaryContent.innerHTML = '';
                
                // Create a formatted display of the summary
                const summaryDiv = document.createElement('div');
                
                // Create summary sections
                const summarySections = document.createElement('div');
                
                // Personal Information Section
                const personalInfo = document.createElement('div');
                personalInfo.innerHTML = `
                    <h5>Personal Information</h5>
                    <p><strong>Applicant Name:</strong> ${data.applicant_name || 'N/A'}</p>
                    <p><strong>Father's Name:</strong> ${data.fathers_name || 'N/A'}</p>
                    <p><strong>Gender:</strong> ${data.gender || 'N/A'}</p>
                    <p><strong>Age/DOB:</strong> ${data.age_dob || 'N/A'}</p>
                    <p><strong>Address:</strong> ${data.address || 'N/A'}</p>
                    <p><strong>Phone:</strong> ${data.phone_number || 'N/A'}</p>
                `;
                summarySections.appendChild(personalInfo);
                
                // Certificate-specific Information
                if (data.caste) {
                    const casteInfo = document.createElement('div');
                    casteInfo.innerHTML = `
                        <h5>Certificate Information</h5>
                        <p><strong>Caste:</strong> ${data.caste}</p>
                        <p><strong>Sub Caste:</strong> ${data.sub_caste || 'N/A'}</p>
                        <p><strong>Family Income:</strong> ${data.family_income || 'N/A'}</p>
                    `;
                    summarySections.appendChild(casteInfo);
                }
                
                // Income-specific Information
                if (data.income_details) {
                    const incomeInfo = document.createElement('div');
                    incomeInfo.innerHTML = `
                        <h5>Income Details</h5>
                        <p><strong>Total Gross Income:</strong> ${data.income_details.total_gross_income || 'N/A'}</p>
                        <p><strong>Income from Lands:</strong> ${data.income_details.income_on_lands || 'N/A'}</p>
                        <p><strong>Income from Business:</strong> ${data.income_details.income_on_business || 'N/A'}</p>
                        <p><strong>Income from Labour:</strong> ${data.income_details.income_on_labour || 'N/A'}</p>
                    `;
                    summarySections.appendChild(incomeInfo);
                }
                
                // EWS-specific Information
                if (data.asset_details) {
                    const assetInfo = document.createElement('div');
                    assetInfo.innerHTML = `
                        <h5>Asset Details</h5>
                        <p><strong>Gross Annual Income:</strong> ${data.asset_details.gross_annual_income || 'N/A'}</p>
                        <p><strong>Agriculture Land:</strong> ${data.asset_details.agriculture_land || 'N/A'}</p>
                        <p><strong>Residential Flat:</strong> ${data.asset_details.residential_flat || 'N/A'}</p>
                    `;
                    summarySections.appendChild(assetInfo);
                }
                
                // Family Member-specific Information
                if (data.deceased_details) {
                    const deceasedInfo = document.createElement('div');
                    deceasedInfo.innerHTML = `
                        <h5>Deceased HOF Details</h5>
                        <p><strong>Name:</strong> ${data.deceased_details.deceased_hof_name || 'N/A'}</p>
                        <p><strong>Father/Husband Name:</strong> ${data.deceased_details.father_husband_name || 'N/A'}</p>
                        <p><strong>Date of Death:</strong> ${data.deceased_details.date_of_death || 'N/A'}</p>
                        <p><strong>Reason for Death:</strong> ${data.deceased_details.reason_for_death || 'N/A'}</p>
                    `;
                    summarySections.appendChild(deceasedInfo);
                    
                    if (data.family_members_of_hof && data.family_members_of_hof.length > 0) {
                        const familyMembers = document.createElement('div');
                        familyMembers.innerHTML = `<h5>Family Members</h5>`;
                        
                        data.family_members_of_hof.forEach((member, index) => {
                            const memberDiv = document.createElement('div');
                            memberDiv.innerHTML = `
                                <p><strong>Member ${index + 1}:</strong> ${member.name} (${member.gender}, Age: ${member.age || 'N/A'}, ${member.relationship_with_hof})</p>
                            `;
                            familyMembers.appendChild(memberDiv);
                        });
                        
                        summarySections.appendChild(familyMembers);
                    }
                }
                
                // Common fields
                const commonFields = document.createElement('div');
                commonFields.innerHTML = `
                    <h5>Additional Information</h5>
                    <p><strong>Ration Card Number:</strong> ${data.ration_card_number || 'N/A'}</p>
                    <p><strong>Community:</strong> ${data.community || 'N/A'}</p>
                    <p><strong>Key Details:</strong> ${data.key_details || 'N/A'}</p>
                    <p><strong>Issuer Authority:</strong> ${data.issuer_authority || 'N/A'}</p>
                    <p><strong>Date of Issue:</strong> ${data.date_of_issue || 'N/A'}</p>
                `;
                summarySections.appendChild(commonFields);
                
                // Source Documents
                if (data.source_documents && data.source_documents.length > 0) {
                    const sourceDocs = document.createElement('div');
                    sourceDocs.innerHTML = `<h5>Source Documents</h5>`;
                    
                    data.source_documents.forEach((doc, index) => {
                        const docDiv = document.createElement('p');
                        docDiv.innerHTML = `<strong>Document ${index + 1}:</strong> ${doc.document_title} (${doc.filename})`;
                        sourceDocs.appendChild(docDiv);
                    });
                    
                    summarySections.appendChild(sourceDocs);
                }
                
                summaryDiv.appendChild(summarySections);
                summaryContent.appendChild(summaryDiv);
            }
            
            function showStatus(message, type) {
                statusMessage.textContent = message;
                statusMessage.className = `status-message alert alert-${type}`;
                statusMessage.style.display = 'block';
                
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
